/* =========================================================

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      s => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[s])
    );

}


function fmt(
  number,
  suffix=""
){

  if(
    number === null ||
    number === undefined ||
    Number.isNaN(Number(number))
  ){
    return "—";
  }

  return (
    new Intl.NumberFormat("cs-CZ")
      .format(Math.round(Number(number)))
    +
    suffix
  );

}


function hashString(value){

  const s=String(value ?? "");

  let h=2166136261;

  for(
    let i=0;
    i<s.length;
    i++
  ){

    h ^= s.charCodeAt(i);

    h=Math.imul(
      h,
      16777619
    );

  }

  return h >>> 0;

}


/* =========================================================
   DEMO HODNOTY
   ========================================================= */

function seeded(
  feature,
  min,
  max
){

  const seed=hashString(

    feature?.properties?.kod ??
    feature?.properties?.objectid ??
    feature?.properties?.nazev ??
    "unknown"

  );

  const t=
    (seed % 10000) / 10000;

  return min + t*(max-min);

}

/* =========================================================
   BAREVNÉ ŠKÁLY
   ========================================================= */

function colorScale(
  layer,
  value
){

  if(layer==="price"){

    const min=42000;
    const max=155000;

    const t=
      Math.max(
        0,
        Math.min(
          1,
          (value-min)/(max-min)
        )
      );

    const hue=
      120-(120*t);

    return `hsl(${hue},78%,48%)`;

  }


  if(layer==="rent"){

    const min=180;
    const max=470;

    const t=
      Math.max(
        0,
        Math.min(
          1,
          (value-min)/(max-min)
        )
      );

    const hue=
      115-(90*t);

    return `hsl(${hue},72%,48%)`;

  }


  if(layer==="green"){

    const t=
      Math.max(
        0,
        Math.min(
          1,
          value/100
        )
      );

    return `
      hsl(
        120,
        ${42+35*t}%,
        ${72-42*t}%
      )
    `;

  }


  if(layer==="noise"){

    const t=
      Math.max(
        0,
        Math.min(
          1,
          value/100
        )
      );

    const hue=
      120-(120*t);

    return `hsl(${hue},78%,48%)`;

  }


  if(layer==="safety"){

    const t=
      Math.max(
        0,
        Math.min(
          1,
          value/100
        )
      );

    return `
      hsl(
        ${215-155*t},
        72%,
        ${56-12*t}%
      )
    `;

  }


  return "#94a3b8";

}


/* =========================================================
   HIERARCHIE PODLE ZOOMU
   ========================================================= */

function hierarchyForZoom(z){

  if(z<=7.5){

    return {
      id:17,
      name:"kraje"
    };

  }

  if(z<=10){

    return {
      id:15,
      name:"okresy"
    };

  }

  if(z<=12.5){

    return {
      id:12,
      name:"obce"
    };

  }

  return {

    id:7,
    name:"katastry"

  };

}


/* =========================================================
   BBOX
   ========================================================= */

function bboxFromMap(map){

  const b=map.getBounds();

  return [

    b.getWest(),

    b.getSouth(),

    b.getEast(),

    b.getNorth()

  ];

}


/* =========================================================
   ČÚZK GEOJSON
   ========================================================= */

async function fetchGeoJSON(
  layerId,
  bbox
){

  const [
    xmin,
    ymin,
    xmax,
    ymax
  ]=bbox;


  const params=
    new URLSearchParams({

      where:"1=1",

      geometry:
        `${xmin},${ymin},${xmax},${ymax}`,

      geometryType:
        "esriGeometryEnvelope",

      inSR:"4326",

      spatialRel:
        "esriSpatialRelIntersects",

      outFields:"*",

      returnGeometry:"true",

      outSR:"4326",

      f:"geojson",

      resultRecordCount:"1000",

      resultOffset:"0"

    });


  const first=
    await fetch(
      `${RUIAN}/${layerId}/query?${params.toString()}`
    );


  if(!first.ok){

    throw new Error(
      `ČÚZK query ${first.status}`
    );

  }


  const firstJson=
    await first.json();


  if(firstJson.error){

    throw new Error(
      firstJson.error.message ||
      "ČÚZK query error"
    );

  }


  let features=
    firstJson.features || [];


  let offset=1000;


  while(
    firstJson.exceededTransferLimit &&
    offset<=5000
  ){

    const p=
      new URLSearchParams(params);

    p.set(
      "resultOffset",
      String(offset)
    );


    const response=
      await fetch(
        `${RUIAN}/${layerId}/query?${p.toString()}`
      );


    if(!response.ok){
      break;
    }


    const json=
      await response.json();


    if(!json.features?.length){
      break;
    }


    features=
      features.concat(
        json.features
      );


    if(!json.exceededTransferLimit){
      break;
    }


    offset+=1000;

  }


  return {

    type:"FeatureCollection",

    features

  };

}


/* =========================================================
   ŠKOLY — OVERPASS
   ========================================================= */

async function fetchSchools(map){

  const b=map.getBounds();


  const south=b.getSouth();
  const west=b.getWest();
  const north=b.getNorth();
  const east=b.getEast();


  const query=`

    [out:json][timeout:20];

    (

      node["amenity"="school"]
      (${south},${west},${north},${east});

      way["amenity"="school"]
      (${south},${west},${north},${east});

      relation["amenity"="school"]
      (${south},${west},${north},${east});

      node["amenity"="kindergarten"]
      (${south},${west},${north},${east});

      node["amenity"="university"]
      (${south},${west},${north},${east});

    );

    out center tags;

  `;


  const url=
    "https://overpass-api.de/api/interpreter?data="+
    encodeURIComponent(query);


  const response=
    await fetch(url);


  if(!response.ok){

    throw new Error(
      "Školní POI služba není dostupná."
    );

  }


  return await response.json();

}


function poiToLatLng(element){

  if(
    element.lat &&
    element.lon
  ){

    return [
      element.lat,
      element.lon
    ];

  }


  if(element.center){

    return [
      element.center.lat,
      element.center.lon
    ];

  }


  return null;

}


function poiName(element){

  return (
    element.tags?.name ||
    "Škola / školské zařízení"
  );

}

                              x=>x[0]===name
                            )
                          )
                        }

                      >

                        <strong>
                          {name}
                        </strong>

                        <span>
                          {reg} · krajské město
                        </span>

                      </div>

                    )
                  )

                }

              </div>

            )
          }

        </form>


        <select

          className="region-select"

          value={region}

          onChange={
            event=>
              flyToRegion(
                event.target.value
              )
          }

          aria-label=
            "Filtrovat kraj"

        >

          {
            REGION_OPTIONS.map(
              currentRegion=>

                <option
                  key={currentRegion}
                >
                  {currentRegion}
                </option>
            )
          }

        </select>


        <div className="mode">

          <button
            className="active"
          >
            Bydlení
          </button>

          <button>
            Profi
          </button>

        </div>

      </div>


      {
        loading &&
        (
          <div className="loading">
            Načítám plošná data ČR…
          </div>
        )
      }


      {
        poiLoading &&
        (
          <div className="loading">
            Načítám body škol…
          </div>
        )
      }


      {
        error &&
        (

          <div
            className="error"
            onClick={()=>
              setError("")
            }
          >
            {error}
          </div>

        )
      }


      <aside className="layers">

        <div className="panel-title">

          <div>

            <div className="eyebrow">
              Mapové vrstvy
            </div>

            <strong>
              Tematická mapa ČR
            </strong>

          </div>

          <span className="status-pill">
            RÚIAN
          </span>

        </div>


        {
          Object.entries(
            LAYERS
          ).map(
            ([key,meta])=>(

              <div

                key={key}

                className={
                  `layer-row ${
                    activeLayer===key
                      ? "active"
                      : ""
                  }`
                }

                onClick={()=>
                  key!=="schools" &&
                  setActiveLayer(key)
                }

              >

                <input

                  type="checkbox"

                  checked={
                    !!enabled[key]
                  }

                  onChange={()=>
                    toggleLayer(key)
                  }

                  onClick={
                    event=>
                      event.stopPropagation()
                  }

                />


                <div className="layer-icon">
                  {meta.icon}
                </div>


                <div className="layer-text">

                  <div className="layer-name">
                    {meta.label}
                  </div>

                  <div className="layer-sub">

                    {
                      meta.poi
                        ? "bodové POI"
                        : "plošná zóna"
                    }

                  </div>

                </div>


                <span
                  className={
                    `status-pill ${
                      meta.real
                        ? "real"
                        : "demo"
                    }`
                  }
                >

                  {
                    meta.real
                      ? "DATA"
                      : "DEMO"
                  }

                </span>

              </div>

            )
          )
        }


        <div className="legend">

          <div className="eyebrow">
            {activeMeta.label}
            {" · barevná škála"}
          </div>


          <div className="legend-bar"></div>


          <div className="legend-labels">

            <span>

              {
                activeLayer==="noise"
                  ? "klid"

                  : activeLayer==="green"
                  ? "méně zeleně"

                  : "nižší"
              }

            </span>


            <span>

              {
                activeLayer==="noise"
                  ? "hluk"

                  : activeLayer==="green"
                  ? "více zeleně"

                  : "vyšší"
              }

            </span>

          </div>


          <div
            style={{
              marginTop:8,
              fontSize:10,
              color:"#667085",
              lineHeight:1.4
            }}
          >

            Kliknutím na polygon otevřeš detail.

            <br/>

            Při přiblížení se hranice automaticky
            přepnou:

            <br/>

            kraje → okresy → obce → katastry.

          </div>

        </div>

      </aside>


      <button

        className="fixed-open"

        onClick={()=>{

          setPanelOpen(
            true
          );

          setOverview(
            !selected
          );

        }}

      >

        {
          selected
            ? "Otevřít přehled lokality"
            : "Seznam zón ČR"
        }

      </button>


      {
        panelOpen &&
        (

          <aside className="detail">

            <div className="detail-head">

              <div>

                <div className="eyebrow">

                  {
                    overview
                      ? "PŘEHLED ČR"
                      : (
                        selected?.level ||
                        "LOKALITA"
                      )
                  }

                </div>


                <h2>

                  {
                    overview
                      ? "Mapa bydlení ČR"
                      : (
                        selected?.name ||
                        "Vyber zónu"
                      )
                  }

                </h2>

              </div>


              <button

                className="close"

                onClick={()=>
                  setPanelOpen(false)
                }

                aria-label="Zavřít"

              >
                ×
              </button>

            </div>


            {
              overview
                ?

                (

                  <>

                    <div className="hero-metric">

                      <span>
                        Mapový systém
                      </span>

                      <strong>
                        Celá ČR
                      </strong>

                      <small>
                        kraje · okresy · obce ·
                        katastrální území
                      </small>

                    </div>


                    <div className="overview-list">

                      <div className="overview-item">

                        <span>
                          Aktivní vrstva
                        </span>

                        <strong>
                          {activeMeta.label}
                        </strong>

                      </div>


                      <div className="overview-item">

                        <span>
                          Úroveň podle zoomu
                        </span>

                        <strong>
                          {
                            hierarchyForZoom(
                              zoom
                            ).name
                          }
                        </strong>

                      </div>


                      <div className="overview-item">

                        <span>
                          Body zájmu
                        </span>

                        <strong>

                          {
                            enabled.schools
                              ? "Školy zapnuty"
                              : "vypnuty"
                          }

                        </strong>

                      </div>


                      <div className="overview-item">

                        <span>
                          Zdroj hranic
                        </span>

                        <strong>
                          ČÚZK / RÚIAN
                        </strong>

                      </div>

                    </div>


                    <div className="data-warning">

                      Hranice území jsou živá data
                      RÚIAN.

                      <br/><br/>

                      Celostátní hodnoty zeleně,
                      hluku a bezpečnosti jsou v této
                      verzi označené jako DEMO.

                    </div>


                    <div className="detail-section">

                      <h3>
                        Připravené datové vrstvy
                      </h3>

                      <p>

                        Ceny, nájmy, zeleň, hluk
                        a bezpečnost používají stejný
                        polygonový systém.

                      </p>

                    </div>

                  </>

                )

                :

                selected

                ?

                (

                  <>

                    {
                      selected.metric?.value != null &&
                      (

                        <div className="hero-metric">

                          <span>

                            {
                              selected.activeLayer==="price"

                                ? "Průměrná nabídková cena bytu"

                                : selected.activeLayer==="rent"

                                ? "Nájem za 1 m² / měsíc"

                                : (
                                  LAYERS[
                                    selected.activeLayer
                                  ]?.label ||
                                  "Hodnota"
                                )
                            }

                          </span>


                          <strong>

                            {
                              selected.activeLayer==="price"

                                ? fmt(
                                    selected.metric.value,
                                    " Kč/m²"
                                  )

                                : selected.activeLayer==="rent"

                                ? fmt(
                                    selected.metric.value,
                                    " Kč/m²/měsíc"
                                  )

                                : Math.round(
                                    selected.metric.value
                                  )
                            }

                          </strong>


                          <small>
                            {selected.metric.label}
                          </small>

                        </div>

                      )
                    }


                    {
                      selected.metric?.real===false &&
                      selected.activeLayer!=="schools" &&
                      (

                        <div className="data-warning">

                          <strong>
                            DEMO DATA.
                          </strong>

                          {" "}

                          Tato hodnota je pouze
                          analytická ukázka pro
                          vykreslení polygonové mapy.

                          <br/><br/>

                          Není to tvrzení o skutečné
                          hodnotě daného území.

                        </div>

                      )
                    }


                    {
                      selected.activeLayer==="schools" &&
                      (

                        <div className="hero-metric">

                          <span>
                            Typ bodu
                          </span>

                          <strong>
                            POI
                          </strong>

                          <small>
                            Školské zařízení
                            z OpenStreetMap
                          </small>

                        </div>

                      )
                    }


                    {
                      selected.activeLayer!=="schools" &&
                      (

                        <div className="score-grid">

                          <div className="score">

                            <span>
                              Zeleň
                            </span>

                            <strong>

                              {
                                Math.round(
                                  getMetric(
                                    selected.feature ||
                                      {
                                        properties:
                                          selected.properties
                                      },
                                    "green"
                                  ).value
                                )
                              }
                              %

                            </strong>

                          </div>


                          <div className="score">

                            <span>
                              Hluk
                            </span>

                            <strong>

                              {
                                Math.round(
                                  getMetric(
                                    selected.feature ||
                                      {
                                        properties:
                                          selected.properties
                                      },
                                    "noise"
                                  ).value
                                )
                              }

                              /100

                            </strong>

                          </div>


                          <div className="score">

                            <span>
                              Bezpečnost
                            </span>

                            <strong>

                              {
                                Math.round(
                                  getMetric(
                                    selected.feature ||
                                      {
                                        properties:
                                          selected.properties
                                      },
                                    "safety"
                                  ).value
                                )
                              }

                              /100

                            </strong>

                          </div>


                          <div className="score">

                            <span>
                              Úroveň mapy
                            </span>

                            <strong>
                              {selected.level}
                            </strong>

                          </div>

                        </div>

                      )
                    }


                    <div className="detail-section">

                      <h3>
                        Informace
                      </h3>

                      <ul>

                        <li>
                          Detailní polygonová zóna
                          bez bodových náhrad za ceny.
                        </li>

                        <li>
                          Hranice vycházejí z dat
                          RÚIAN.
                        </li>

                        <li>
                          Po přiblížení se automaticky
                          zobrazí jemnější územní jednotky.
                        </li>

                      </ul>

                    </div>


                    <div className="detail-section">

                      <h3>
                        Poznámky k datům
                      </h3>

                      <ul>

                        <li>
                          DEMO indexy nelze použít
                          jako skutečný cenový,
                          investiční nebo bezpečnostní
                          ukazatel.
                        </li>

                        <li>
                          Nabídková cena RealityMIX
                          není totéž co realizovaná
                          transakční cena.
                        </li>

                      </ul>

                    </div>


                    <div className="source">

                      <strong>
                        Zdroj hranic:
                      </strong>

                      {" "}
                      ČÚZK / RÚIAN.

                      <br/>

                      <strong>
                        Zdroj cen a nájmů:
                      </strong>

                      {" "}
                      RealityMIX 09/2026.

                      <br/>

                      <strong>
                        POI školy:
                      </strong>

                      {" "}
                      OpenStreetMap /
                      Overpass API.

                      <br/>

                      <strong>
                        Ostatní celostátní hodnoty:
                      </strong>

                      {" "}
                      DEMO.

                    </div>

                  </>

                )

                :

                null
            }

          </aside>

        )
      }

    </>

  );

}


ReactDOM.createRoot(
  document.getElementById("root")
).render(
  <App />
);

</script>

</body>
</html>
